# fig11: 逐请求总 token 守恒的构成扫描基础配置
# 从 sweep_composition_base.yaml（fig10）复制，引擎与 workload 参数完全一致；
# 本轮唯一主动扫描的变量是"构成倍率 a"，但变换方式与 fig10 不同：在实验脚本内对生成
# 请求做确定性后处理，对**每条请求**同时调整 P/D、严格保持 P_i + D_i 不变。

admission_number: 5000
lambda_arrival: 32.0

norm_ratio: 0.7
norm_loc: 100
norm_scale: 30
pareto_shape: 1.4
pareto_scale: 40

beta0: 3
beta1: 0.75
sigma: 0.3

answer_len_cap: 4096
prompt_len_cap: 4096

TN: 0.0
TP: 0.0
FN: 0.0
FP: 0.0
label_threshold_percentail: 0.85

BT_BASE_C: 0.003
BT_SLOPE_A: 0.00002
BT_KNEE_B0: 64
BT_CONC_GAMMA: 0.0
BT_JITTER_STD: 0.0
BT_MIN: 0.0001

KV_total_capacity: 8192
KV_safety_threshold: 0.7

budget_tokens: 128
request_block_size: 8

seed: 42

schedule_method: QBA
gamma: 0.80
quota_k: 5
ageing_measure: history

steady_state:
  enabled: false
  trim_ratio: 0.1
