# fig12: p × 预测误差 × 构成 联合分析基础配置
# 从 sweep_request_composition_base.yaml（fig11）复制，引擎与 workload 参数完全一致。
# 复用 fig11 的逐请求总 token 守恒生成方式，但额外扫描标签阈值 p 与预测误差设置：
#   - 构成倍率 a ∈ {0.5, 1, 2}
#   - 标签阈值 p ∈ {0.75, 0.85, 0.95}
#   - 误差设置 ∈ {Oracle, SL=0.1/0.3, LS=0.1/0.3}（另一方向为 0）
# 误差标签在长度变换与真标签重算之后注入（见 sweep_p_error_composition.py）。
# 本文件中的 TN/TP/FN/FP 保持 0：误差由适配层在变换后单独注入，不走 workload 的
# _assign_labels 路径，以免被 fig11 的 Oracle 真标签重算覆盖。

admission_number: 5000
lambda_arrival: 32.0

norm_ratio: 0.7
norm_loc: 100
norm_scale: 30
pareto_shape: 1.4
pareto_scale: 40

beta0: 3
beta1: 0.75
sigma: 0.3

answer_len_cap: 4096
prompt_len_cap: 4096

TN: 0.0
TP: 0.0
FN: 0.0
FP: 0.0
label_threshold_percentail: 0.85

BT_BASE_C: 0.003
BT_SLOPE_A: 0.00002
BT_KNEE_B0: 64
BT_CONC_GAMMA: 0.0
BT_JITTER_STD: 0.0
BT_MIN: 0.0001

KV_total_capacity: 8192
KV_safety_threshold: 0.7

budget_tokens: 128
request_block_size: 8

seed: 42

schedule_method: QBA
gamma: 0.80
quota_k: 5
ageing_measure: history

steady_state:
  enabled: false
  trim_ratio: 0.1
